version: 2

updates:
  # Security updates always target GitHub's default branch. This entry suppresses
  # routine version PRs on main while retaining labels, ownership, and grouping.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 0
    assignees:
      - "JoelBondoux"
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "security"
      include: "scope"
    groups:
      npm-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  # Routine dependency work enters through the development branch.
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    versioning-strategy: "increase-if-necessary"
    assignees:
      - "JoelBondoux"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      npm-minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions security fixes remain isolated from routine version updates.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "06:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 0
    assignees:
      - "JoelBondoux"
    labels:
      - "dependencies"
      - "security"
      - "github-actions"
    commit-message:
      prefix: "security"
      include: "scope"
    groups:
      actions-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "06:15"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    assignees:
      - "JoelBondoux"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions-minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
